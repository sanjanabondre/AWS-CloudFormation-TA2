AWSTemplateFormatVersion: '2010-09-09'
Description: TA-2 event-driven serverless S3 file processing with Lambda in a private subnet and SNS alerts.

Parameters:
  BucketName:
    Type: String
    Description: Globally unique S3 bucket name. Use lowercase letters, numbers, and hyphens.
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: Must be a valid 3-63 character S3 bucket name using lowercase letters, numbers, dots, or hyphens.
  NotificationEmail:
    Type: String
    Description: Email address that should receive processing alerts.
    AllowedPattern: '^[^@]+@[^@]+\.[^@]+$'
    ConstraintDescription: Enter a valid email address.

Resources:
  FileProcessingVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: TA2-FileProcessing-VPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: TA2-FileProcessing-IGW

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref FileProcessingVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FileProcessingVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: TA2-Public-Subnet

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FileProcessingVPC
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: TA2-Private-Subnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FileProcessingVPC
      Tags:
        - Key: Name
          Value: TA2-Public-RouteTable

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachInternetGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: TA2-NAT-EIP

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: PublicSubnetRouteTableAssociation
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      ConnectivityType: public
      Tags:
        - Key: Name
          Value: TA2-NAT-Gateway

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FileProcessingVPC
      Tags:
        - Key: Name
          Value: TA2-Private-RouteTable

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for TA-2 file-processing Lambda
      VpcId: !Ref FileProcessingVPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: TA2-Lambda-SG

  FileProcessingTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: FileProcessingAlerts
      DisplayName: TA-2 File Processing Alerts

  EmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref FileProcessingTopic

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: TA2-S3ReadWriteAndSNSPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/*'
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref FileProcessingTopic

  FileProcessingFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: TA2-FileProcessingFunction
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref FileProcessingTopic
          LOG_PREFIX: processed/
      Code:
        ZipFile: |
          import boto3
          import json
          import os
          from datetime import datetime, timezone
          from urllib.parse import unquote_plus

          s3 = boto3.client("s3")
          sns = boto3.client("sns")

          def lambda_handler(event, context):
              results = []
              for record in event.get("Records", []):
                  if record.get("eventSource") != "aws:s3":
                      continue

                  bucket = record["s3"]["bucket"]["name"]
                  key = unquote_plus(record["s3"]["object"]["key"])

                  metadata = {
                      "status": "SUCCESS",
                      "source_bucket": bucket,
                      "source_key": key,
                      "event_name": record.get("eventName", "unknown"),
                      "processed_at_utc": datetime.now(timezone.utc).isoformat(),
                      "lambda_request_id": context.aws_request_id
                  }

                  # Store logs outside the uploads/ event filter to prevent recursion.
                  filename = key.rsplit("/", 1)[-1]
                  log_key = os.environ.get("LOG_PREFIX", "processed/") + filename + ".metadata.json"
                  s3.put_object(
                      Bucket=bucket,
                      Key=log_key,
                      Body=json.dumps(metadata, indent=2).encode("utf-8"),
                      ContentType="application/json"
                  )

                  message = (
                      "File processing completed successfully.\n"
                      f"Bucket: {bucket}\n"
                      f"Object key: {key}\n"
                      f"Metadata log: {log_key}\n"
                      f"Status: SUCCESS"
                  )
                  sns.publish(
                      TopicArn=os.environ["SNS_TOPIC_ARN"],
                      Subject="TA-2: File processed successfully",
                      Message=message
                  )
                  results.append({"bucket": bucket, "key": key, "log_key": log_key})

              return {"statusCode": 200, "processed": results}

  AllowS3InvokeLambda:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FileProcessingFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}'

  FileUploadBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - AllowS3InvokeLambda
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt FileProcessingFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
      Tags:
        - Key: Name
          Value: TA2-FileProcessing-Bucket

Outputs:
  S3BucketName:
    Description: Upload test files under the uploads/ prefix in this bucket.
    Value: !Ref FileUploadBucket
  LambdaFunctionName:
    Description: Lambda function running in the private subnet.
    Value: !Ref FileProcessingFunction
  SNSTopicArn:
    Description: SNS topic for processing alerts.
    Value: !Ref FileProcessingTopic
  VPCId:
    Description: VPC created for the assessment.
    Value: !Ref FileProcessingVPC
  PrivateSubnetId:
    Description: Private subnet containing the Lambda function.
    Value: !Ref PrivateSubnet
